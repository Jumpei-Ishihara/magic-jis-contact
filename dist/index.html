<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="デスクのキーボードと連動するお問い合わせ画面。"><title>お問い合わせ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#919d90;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}main{position:relative;width:100%;height:100svh;min-height:380px;background:#919d90}#view{position:absolute;inset:0;width:100%;height:100%}canvas{display:block;width:100%;height:100%;outline:none}
.writing{width:1180px;height:650px;position:absolute;pointer-events:auto;visibility:hidden;overflow:hidden;border-radius:7px;background:#fafafa;color:#30373c}.writing.ready{visibility:visible}
.contact{height:100%;padding:30px 78px;background:#fafafa}.heading{display:flex;align-items:center;justify-content:space-between;padding-bottom:20px;border-bottom:1px solid #dce1e3}.heading h1{font-size:36px;letter-spacing:.04em;font-weight:600;margin:0}.heading span{font-size:19px;color:#7a8389;letter-spacing:.15em}.intro{font-size:21px;line-height:1.5;color:#687279;margin:16px 0 22px}
form{display:grid;gap:16px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:24px}.field{display:flex;flex-direction:column;gap:8px}label{font-size:23px;font-weight:500;line-height:1.3}.required{font-size:17px;font-weight:400;color:#7a8389;margin-left:10px}input,textarea{width:100%;border:1px solid #d5dbdf;border-radius:7px;background:#fff;color:#30373c;caret-color:#3e5942;font:400 25px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;outline:none;transition:border-color .15s,box-shadow .15s}input{height:49px;padding:7px 15px}textarea{height:119px;resize:none;padding:10px 15px}input::placeholder,textarea::placeholder{color:#939b9f}input:focus,textarea:focus{border-color:#6f8667;box-shadow:0 0 0 3px #627c5626;background:#fff}
.actions{display:flex;align-items:center;justify-content:space-between;margin-top:3px}.note{font-size:18px;color:#788187;margin:0}button{height:51px;min-width:230px;padding:0 35px;border:0;border-radius:7px;background:#435d4a;color:#eef2e9;font:500 23px/1 -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer}button:hover{background:#354f3c}button:focus-visible{outline:3px solid #829b76;outline-offset:4px}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:#d3c7b1;font-size:13px;pointer-events:none;z-index:4}#loading.done{display:none}
</style></head>
<body><main>
<section class="writing" aria-label="お問い合わせフォーム"><div class="contact">
<header class="heading"><h1>お問い合わせ</h1><span>CONTACT</span></header>
<p class="intro">ご質問やご相談など、お気軽にお問い合わせください。</p>
<form aria-label="お問い合わせ" novalidate>
<div class="pair"><div class="field"><label for="contact-name">お名前<span class="required">必須</span></label><input id="contact-name" name="name" autocomplete="name" placeholder="山田 太郎" aria-required="true"></div><div class="field"><label for="contact-email">メールアドレス<span class="required">必須</span></label><input id="contact-email" name="email" type="email" autocomplete="email" placeholder="example@email.com" aria-required="true"></div></div>
<div class="field"><label for="contact-subject">件名<span class="required">必須</span></label><input id="contact-subject" name="subject" placeholder="お問い合わせの件名" aria-required="true"></div>
<div class="field"><label for="writing">お問い合わせ内容<span class="required">必須</span></label><textarea id="writing" name="message" placeholder="お問い合わせ内容をご記入ください。" aria-required="true" spellcheck="false"></textarea></div>
<div class="actions"><p class="note">ご入力内容をご確認のうえ、お進みください。</p><button type="button">内容を確認する <span aria-hidden="true">→</span></button></div>
</form></div></section>
<div id="view" aria-label="入力したキーに合わせて動く3Dキーボード"><div id="loading" role="status">キーボードを準備しています…</div></div>
</main><script type="module" src="./app.js?v=20261024-contact-white-1"></script></body></html>
